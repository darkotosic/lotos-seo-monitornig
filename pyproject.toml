[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lotos-seo-monitor"
version = "3.0.0"
description = "Read-only SEO monitoring for multi-domain Lotos storefronts"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "defusedxml>=0.7.1,<1",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.30,<3",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
lotos-seo-monitor = "seo_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["seo_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
