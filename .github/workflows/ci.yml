name: Monitor CI

on:
  push:
    paths:
      - 'seo_monitor/**'
      - 'tests/**'
      - 'config/**'
      - 'pyproject.toml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/seo-daily.yml'
      - '.github/workflows/telegram-test.yml'
      - '.github/workflows/seo-watchdog.yml'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check seo_monitor tests
      - run: python -m compileall -q seo_monitor
      - run: python -m seo_monitor validate --config config/sites.yml
      - run: python -m pytest -q
