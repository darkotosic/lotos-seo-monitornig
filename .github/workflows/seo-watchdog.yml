name: SEO Monitoring Watchdog

on:
  schedule:
    # Independent daily check, several hours after 06:17 UTC SEO Daily Monitoring.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install monitoring package
        run: python -m pip install -e .
      - name: Check latest successful SEO run, alert Telegram on failure
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_MONITOR_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.SEO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.SEO_TELEGRAM_CHAT_ID }}
        run: python -m seo_monitor.watchdog
